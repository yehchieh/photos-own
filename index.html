<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>圖片下載</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400&family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  /* Minimal Brutalism — 只用黑、灰、白 */
  :root {
    --ink:#000; --gray:#6b6b6b; --soft:#e9e9e9; --bg:#fff; --rule:3px solid #000; --hair:2px solid #000;
    /* 英文 Didot（沒有 Didot 的裝置用 Bodoni Moda 代替），中文 思源宋體 */
    --serif:"Didot","Bodoni 72","Bodoni Moda","Source Han Serif TC","Noto Serif TC","思源宋體","Songti TC",serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background:var(--bg); }
  body { margin:0; font-family:var(--serif); color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased; }
  .wrap { max-width:1120px; margin:0 auto; padding:0 16px 180px; }

  /* 頂條 */
  .top { display:flex; justify-content:space-between; align-items:baseline; gap:12px;
         padding:14px 0 12px; border-bottom:var(--rule); font-size:12px; letter-spacing:.24em; text-transform:uppercase; }
  .top b { font-weight:700; }

  #back { display:none; background:none; border:0; padding:20px 0 0; margin:0; font:inherit; font-size:20px;
          color:var(--ink); cursor:pointer; text-decoration:underline; text-underline-offset:5px; text-decoration-thickness:2px; }
  #back:hover { text-decoration-thickness:4px; }

  /* 超大標題 */
  h1 { font-size:clamp(64px, 15vw, 176px); line-height:.9; font-weight:400; letter-spacing:-.03em;
       margin:28px 0 0; padding-bottom:20px; border-bottom:var(--rule); overflow-wrap:anywhere; }
  #sub { color:var(--gray); font-size:clamp(18px, 3vw, 26px); margin:16px 0 36px; line-height:1.4; }
  #sub:empty { margin:0 0 36px; }

  /* 網格：格線相連，不留縫 */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:0;
          border-top:var(--hair); border-left:var(--hair); }
  .grid:has(.folder) { grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); counter-reset:n; }
  @media (max-width:480px) {
    .grid { grid-template-columns:repeat(2,1fr); }
    .grid:has(.folder) { grid-template-columns:1fr; }
  }

  .card { background:var(--bg); border:0; border-right:var(--hair); border-bottom:var(--hair); border-radius:0; overflow:hidden; }
  .card img { width:100%; aspect-ratio:1; object-fit:contain; display:block; border-bottom:var(--hair);
    background:repeating-conic-gradient(var(--soft) 0% 25%, #fff 0% 50%) 50%/16px 16px; }
  .card img:not([src]) { background:var(--soft); animation:pulse 1.2s ease-in-out infinite; }
  .card div { padding:8px 10px; font-size:13px; color:var(--gray); word-break:break-all; }

  /* 資料夾卡：大編號、大名稱，點按反白 */
  .folder { cursor:pointer; text-align:left; padding:0; font:inherit; color:inherit; counter-increment:n;
            transition:background .12s, color .12s; }
  .folder img { filter:grayscale(1); }
  .folder div { font-size:clamp(26px, 3.4vw, 36px); line-height:1.1; color:var(--ink); padding:16px 16px 20px; }
  .folder div::before { content:counter(n, decimal-leading-zero); display:block; font-size:13px; letter-spacing:.2em;
                        color:var(--gray); margin-bottom:10px; }
  .folder small { display:block; color:var(--gray); font-size:14px; letter-spacing:.12em; margin-top:10px; }
  .folder:hover, .folder:active { background:var(--ink); }
  .folder:hover div, .folder:active div, .folder:hover small, .folder:active small,
  .folder:hover div::before, .folder:active div::before { color:#fff; }
  .folder:focus-visible { outline:4px solid var(--ink); outline-offset:-8px; }

  .soon { cursor:default; color:var(--gray); }
  .soon:hover { background:var(--bg); }
  .soon:hover div, .soon:hover small, .soon:hover div::before { color:var(--gray); }
  .soon div { color:var(--gray); }
  .soon .ph { aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:22px; letter-spacing:.3em;
    color:var(--gray); padding:0; border-bottom:var(--hair);
    background:repeating-linear-gradient(45deg,#fff 0 12px,var(--soft) 12px 14px); }
  .soon .ph::before { content:none; }

  .section { font-size:12px; letter-spacing:.24em; color:var(--ink); margin:56px 0 0; padding:10px 0;
             border-top:var(--rule); text-transform:uppercase; }

  /* 底部按鈕 */
  .dock { position:fixed; left:0; right:0; bottom:0; padding:14px 16px calc(14px + env(safe-area-inset-bottom));
          background:var(--bg); border-top:var(--rule); text-align:center; display:none; }
  #btn { width:100%; max-width:560px; padding:20px 16px; font:inherit; font-size:clamp(20px, 5vw, 26px); font-weight:700;
         letter-spacing:.06em; border:var(--rule); border-radius:0; background:var(--ink); color:#fff; cursor:pointer;
         box-shadow:6px 6px 0 var(--gray); transition:transform .08s, box-shadow .08s; }
  #btn:active:not(:disabled) { transform:translate(6px,6px); box-shadow:0 0 0 var(--gray); }
  #btn:disabled { background:var(--soft); color:var(--gray); border-color:var(--gray); box-shadow:none; cursor:default; }
  #hint { font-size:14px; color:var(--gray); margin-top:12px; min-height:20px; }
  .err { color:var(--ink) !important; font-weight:700; text-decoration:underline; text-underline-offset:4px; }

  .banner { background:var(--ink); color:#fff; border:0; border-radius:0; padding:14px 16px; font-size:15px; line-height:1.5;
            margin:16px 0 0; display:none; }

  /* 方形旋轉載入 */
  .spin { width:28px; height:28px; border:3px solid var(--soft); border-top-color:var(--ink); border-radius:0;
          animation:r .9s linear infinite; margin:56px auto; grid-column:1/-1; }
  .grid:has(.spin) { border:0; }
  @keyframes r { to { transform:rotate(360deg); } }
  @keyframes pulse { 50% { opacity:.45; } }
  @media (prefers-reduced-motion:reduce) { .spin, .card img:not([src]) { animation-duration:3s; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><b>Images</b><span>圖片下載</span></div>
  <div class="banner" id="lineTip">你正在 LINE 裡面開啟，可能無法儲存。請點右上角「⋯」→「在瀏覽器中開啟」。</div>
  <button id="back">← 返回</button>
  <h1 id="title">載入中…</h1>
  <p id="sub"></p>
  <div id="content"><div class="grid"><div class="spin"></div></div></div>
</div>

<div class="dock" id="dock">
  <button id="btn" disabled>載入中…</button>
  <div id="hint"></div>
</div>

<script>
// ▼ Apps Script 部署網址（結尾 /exec）
const API = 'https://script.google.com/macros/s/AKfycby26iYK8y7DopOm2Vi-I9hKp0bsgu7SFUpwl5EGShHTGkIZF9OVWLxUSZ0BV4F89Ssi/exec';

const $ = id => document.getElementById(id);
const ua = navigator.userAgent;
const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /Android/.test(ua);
const isMobile = isIOS || isAndroid;
if (/\bLine\//i.test(ua)) $('lineTip').style.display = 'block';

const rootId = new URLSearchParams(location.search).get('id') || '';
let files = [], folderName = 'images', session = 0;
const folderCache = {};

function hint(msg, err) { $('hint').textContent = msg; $('hint').className = err ? 'err' : ''; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function b64ToFile(b64, name, type) {
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  type = type || (/\.jpe?g$/i.test(name) ? 'image/jpeg' : 'image/png');
  return new File([bytes], name, { type });
}
async function api(q) {
  const res = await fetch(API + '?' + q).then(r => r.json());
  if (!res.ok) throw new Error(res.error);
  return res;
}
async function loadFile(f, tries = 3) {
  for (let i = 0; ; i++) {
    try {
      const res = await api('file=' + encodeURIComponent(f.id));
      return b64ToFile(res.data, f.name, res.type || f.type);
    } catch (e) {
      if (i >= tries - 1) throw new Error('圖片下載失敗，請重新整理再試一次');
      await new Promise(ok => setTimeout(ok, 1000 * (i + 1)));
    }
  }
}
async function pool(items, limit, fn) {
  let next = 0;
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, async () => {
    while (next < items.length) { const i = next++; await fn(items[i], i); }
  }));
}
function canShareFiles() {
  try { return !!(navigator.canShare && files.length && navigator.canShare({ files })); } catch { return false; }
}
async function getFolder(id) {
  if (!folderCache[id]) folderCache[id] = api(id ? 'id=' + encodeURIComponent(id) : '').catch(e => { delete folderCache[id]; throw e; });
  return folderCache[id];
}

// ---------- 畫面 ----------
async function show(id, isRoot) {
  const my = ++session;
  files = [];
  $('dock').style.display = 'none';
  $('back').style.display = isRoot ? 'none' : 'block';
  $('title').textContent = '載入中…'; $('sub').textContent = '';
  $('content').innerHTML = '<div class="grid"><div class="spin"></div></div>';
  window.scrollTo(0, 0);

  let res;
  try { res = await getFolder(id); }
  catch (e) {
    if (my !== session) return;
    $('title').textContent = '無法載入'; $('sub').textContent = e.message; $('sub').className = 'err';
    $('content').innerHTML = ''; return;
  }
  if (my !== session) return;
    // 子資料夾清單已經一起拿到了，先存起來，點進去就不用再等
  res.folders.forEach(f => {
    if (f.files && !f.subCount && !folderCache[f.id]) {
      folderCache[f.id] = Promise.resolve({ ok: true, folderName: f.name, folders: [], files: f.files });
    }
  });
  $('sub').className = '';
  folderName = res.folderName;
  $('title').textContent = folderName;
  document.title = folderName;

  let html = '';
  if (res.folders.length) {
    $('sub').textContent = res.files.length ? '' : '請選擇要下載的資料夾';
    html += (res.files.length ? '<div class="section">資料夾</div>' : '') + '<div class="grid">' + res.folders.map(f =>
      (f.count || f.subCount) ? `
      <button class="card folder" data-id="${esc(f.id)}">
        <img ${f.cover ? `data-cover="${esc(f.cover)}"` : 'src="data:image/gif;base64,R0lGODlhAQABAAAAACw="'} alt="">
        <div>${esc(f.name)}<small>${f.count ? f.count + ' 張' : '多個資料夾'}</small></div>
      </button>` : `
      <div class="card folder soon">
        <div class="ph">準備中</div>
        <div>${esc(f.name)}<small>圖片準備中，請稍後再來</small></div>
      </div>`).join('') + '</div>';
  }
  if (res.files.length) {
    if (!res.folders.length) $('sub').textContent = `共 ${res.files.length} 張圖片`;
    html += (res.folders.length ? `<div class="section">這裡的圖片（${res.files.length} 張）</div>` : '') +
      '<div class="grid">' + res.files.map((f, i) => `
      <div class="card"><img id="img${i}" alt=""><div>${esc(f.name)}</div></div>`).join('') + '</div>';
  }
  if (!html) html = '<p style="color:var(--gray);text-align:center;margin:80px 0;font-size:24px">圖片準備中，請稍後再來</p>';
  $('content').innerHTML = html;

  $('content').querySelectorAll('button.folder').forEach(b => b.onclick = () => {
    history.pushState({ id: b.dataset.id }, '', '?id=' + encodeURIComponent(rootId) + '&f=' + encodeURIComponent(b.dataset.id));
    show(b.dataset.id, false);
  });

  // 封面縮圖
  const covers = [...$('content').querySelectorAll('img[data-cover]')];
  pool(covers, 4, async img => {
    try {
      const r = await api('file=' + encodeURIComponent(img.dataset.cover) + '&thumb=1');
      if (my === session) img.src = 'data:image/png;base64,' + r.data;
    } catch (_) {}
  });

  if (res.files.length) await prepareFiles(res.files, my);
}

async function prepareFiles(list, my) {
  $('dock').style.display = 'block';
  $('btn').disabled = true;
  $('btn').textContent = `準備中… 0 / ${list.length}`;
  hint('');
  const loaded = new Array(list.length);
  let done = 0;
  try {
    await pool(list, 10, async (f, i) => {
      const file = await loadFile(f);
      if (my !== session) return;
      loaded[i] = file;
      const img = $('img' + i); if (img) img.src = URL.createObjectURL(file);
      $('btn').textContent = `準備中… ${++done} / ${list.length}`;
    });
  } catch (e) {
    if (my !== session) return;
    $('btn').textContent = '無法下載'; hint(e.message, true); return;
  }
  if (my !== session) return;
  files = loaded;
  $('btn').disabled = false;
  if (isMobile && canShareFiles()) {
    $('btn').textContent = `存到相簿（${files.length} 張）`;
    hint(isIOS ? `按下後選「儲存 ${files.length} 張影像」` : '按下後選擇「相簿」或「儲存到裝置」');
  } else if (isMobile) {
    $('btn').textContent = '下載全部（zip）';
    hint('這個瀏覽器不支援直接存相簿；也可以長按每張圖片儲存');
  } else {
    $('btn').textContent = `下載全部圖片（${files.length} 張）`;
    hint('會下載成一個 zip 檔');
  }
}

$('btn').onclick = async () => {
  if (isMobile && canShareFiles()) {
    try { await navigator.share({ files }); hint('完成！到相簿看看吧'); }
    catch (e) { if (e.name !== 'AbortError') hint('沒有成功，請再按一次，或長按圖片儲存', true); }
    return;
  }
  $('btn').disabled = true; hint('打包中…');
  try {
    if (!window.JSZip) await new Promise((ok, bad) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
      s.onload = ok; s.onerror = () => bad(new Error('打包工具載入失敗'));
      document.head.appendChild(s);
    });
    const zip = new JSZip(), used = {};
    files.forEach(f => {
      let n = f.name;
      if (used[n]) { const d = n.lastIndexOf('.'); n = n.slice(0, d) + ` (${++used[f.name]})` + n.slice(d); } else used[n] = 1;
      zip.file(n, f);
    });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(await zip.generateAsync({ type: 'blob' }));
    a.download = folderName + '.zip';
    document.body.appendChild(a); a.click(); a.remove();
    hint('下載完成');
  } catch (e) { hint(e.message, true); }
  $('btn').disabled = false;
};

$('back').onclick = () => history.back();
window.onpopstate = () => {
  const f = new URLSearchParams(location.search).get('f');
  f ? show(f, false) : show(rootId, true);
};

// 啟動：網址有 &f= 就直接進子資料夾
const startF = new URLSearchParams(location.search).get('f');
if (startF) { history.replaceState(null, '', '?id=' + encodeURIComponent(rootId)); history.pushState(null, '', '?id=' + encodeURIComponent(rootId) + '&f=' + encodeURIComponent(startF)); show(startF, false); }
else show(rootId, true);
</script>
</body>
</html>
